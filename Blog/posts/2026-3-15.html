<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026-3-15</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 20px;
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: Arial, Helvetica, sans-serif;

    }

    .logo {
      display: block;
      width: 65px;
      height: 65px;
      object-fit: contain;
    }

    .container {
      max-width: 80%;
      margin: 50px auto;
    }

    h1 {
      font-size: clamp(30px, 5vw, 42px);
      margin-bottom: 10px;
    }

    h2 {
      font-size: 23px;
      margin-bottom: 15px;
      color: #38bdf8;
    }

    .post {
      background-color: #111827;
      border: 1px solid #263244;
      border-radius: 12px;
      padding: 30px;
    }

    .post p {
      color: #cbd5e1;
      font-size: 16px;
      margin: 0;
    }

    .post-navigation {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
    }

    .post-navigation a {
      color: #38bdf8;
      text-decoration: none;
    }

    .post-navigation a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 15px;
      }

      .container {
        max-width: 95%;
        margin: 30px auto;
      }

      .post {
        padding: 20px;
      }

</head>
